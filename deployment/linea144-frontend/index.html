<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Línea 144 - Panel de Predicción</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Línea 144 - Modelos Predictivos</h1>
      <div class="header-controls">
        <div class="url-box">
          <label for="apiUrl">URL API:</label>
          <input type="text" id="apiUrl" value="http://127.0.0.1:8000" />
        </div>
        <div class="url-box">
          <label for="apiKey">API Key:</label>
          <input type="password" id="apiKey" value="linea144-web-2026-xyz" placeholder="Ingresa tu API Key" />
        </div>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h2>1. Clasificar Nivel de Riesgo</h2>
        <form id="formRiesgo">
          <div class="row-2">
            <div class="form-group">
              <label for="edad">Edad de la víctima</label>
              <input type="number" id="edad" value="32" min="0" max="120" required />
            </div>
            <div class="form-group">
              <label for="provincia">Provincia (calcula log_pobl_prov)</label>
              <select id="provincia">
                <option value="16.68">Buenos Aires</option>
                <option value="14.95">CABA</option>
                <option value="15.16">Córdoba</option>
                <option value="15.08">Santa Fe</option>
                <option value="14.52">Mendoza</option>
                <option value="14.36">Tucumán</option>
                <option value="14.18">Salta</option>
                <option value="14.17">Entre Ríos</option>
                <option value="14.06">Misiones</option>
                <option value="13.95">Chaco</option>
                <option value="13.99">Corrientes</option>
                <option value="13.87">Santiago del Estero</option>
                <option value="13.62">San Juan</option>
                <option value="13.61">Jujuy</option>
                <option value="13.54">Río Negro</option>
                <option value="13.50">Neuquén</option>
                <option value="13.32">Formosa</option>
                <option value="13.31">Chubut</option>
                <option value="13.20">San Luis</option>
                <option value="12.97">Catamarca</option>
                <option value="12.86">La Rioja</option>
                <option value="12.81">La Pampa</option>
                <option value="12.72">Santa Cruz</option>
                <option value="12.16">Tierra del Fuego</option>
              </select>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="generoVictima">Género de la víctima</label>
              <select id="generoVictima">
                <option value="mujer">Mujer</option>
                <option value="varon">Varón</option>
                <option value="otro">Otro / No informa</option>
              </select>
            </div>
            <div class="form-group">
              <label for="generoAgresor">Género persona agresora</label>
              <select id="generoAgresor">
                <option value="varon">Varón</option>
                <option value="mujer">Mujer</option>
                <option value="otro">Otro / No informa</option>
              </select>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="vinculo">Vínculo con persona agresora</label>
              <select id="vinculo">
                <option value="pareja">Pareja</option>
                <option value="ex pareja">Ex pareja</option>
                <option value="otro familiar">Otro familiar</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="form-group">
              <label for="isWeekend">¿Llamada en fin de semana?</label>
              <select id="isWeekend">
                <option value="0">No (Lunes a Viernes)</option>
                <option value="1">Sí (Sábado o Domingo)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Tipos de Violencia</label>
            <div class="checkbox-grid">
              <label class="checkbox-item"><input type="checkbox" id="v_psicologica" checked /> Psicológica</label>
              <label class="checkbox-item"><input type="checkbox" id="v_simbolica" /> Simbólica</label>
              <label class="checkbox-item"><input type="checkbox" id="v_economica" checked /> Económica y patrimonial</label>
              <label class="checkbox-item"><input type="checkbox" id="v_domestica" checked /> Doméstica</label>
            </div>
          </div>

          <div class="form-group">
            <label>Modalidades de Violencia</label>
            <div class="checkbox-grid">
              <label class="checkbox-item"><input type="checkbox" id="m_institucional" /> Institucional</label>
              <label class="checkbox-item"><input type="checkbox" id="m_laboral" /> Laboral</label>
              <label class="checkbox-item"><input type="checkbox" id="m_otras" /> Otras modalidades</label>
            </div>
          </div>

          <button type="submit" id="btnRiesgo">Evaluar Riesgo</button>
        </form>
        <div id="resRiesgo" class="resultado"></div>
      </div>

      <div class="card">
        <h2>2. Estimar Demanda Diaria</h2>
        <form id="formVolumen">
          <div class="form-group">
            <label for="fecha">Fecha a estimar</label>
            <input type="date" id="fecha" required />
          </div>
          <div class="form-group">
            <label for="lag1">Llamadas del día anterior (lag_1)</label>
            <input type="number" id="lag1" value="54" step="0.1" required />
          </div>
          <div class="form-group">
            <label for="lag7">Llamadas de hace 7 días (lag_7)</label>
            <input type="number" id="lag7" value="61" step="0.1" required />
          </div>
          <button type="submit" id="btnVolumen">Predecir Volumen</button>
        </form>
        <div id="resVolumen" class="resultado"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
